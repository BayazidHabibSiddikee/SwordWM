# =========================================================
# ~/.config/swordwm/config — SwordWM runtime configuration
#
# Reload without restart: Mod+Shift+r  (or kill -HUP <pid>)
# All changes apply instantly on reload.
# =========================================================

# ── Terminal emulator ─────────────────────────────────────
terminal         = ghostty

# ── Modifier key: super (Win key) or alt ─────────────────
mod              = super

# ── Gaps (pixels) ─────────────────────────────────────────
gap_inner        = 8
gap_outer        = 8

# ── Window decoration ─────────────────────────────────────
border_width     = 2
title_bar_height = 24

# ── Focus model ───────────────────────────────────────────
# true = focus follows mouse pointer, false = click-to-focus
focus_follows_mouse = false

# ── Colours ───────────────────────────────────────────────
# Tokyo Night palette — change freely, reload with Mod+Shift+r
color_focused_border     = #5e81f4
color_unfocused_border   = #2a2d3e
color_focused_title_bg   = #1e2030
color_focused_title_fg   = #c0caf5
color_unfocused_title_bg = #16161e
color_unfocused_title_fg = #565f89
color_urgent_border      = #f7768e

# ── Keybindings ───────────────────────────────────────────
# Format: bind Mod[+Shift][+Ctrl]+Key = action [arg]
# Actions: spawn, close, focus_next, focus_prev,
#          toggle_floating, rotate_layout, gap_inc, gap_dec,
#          quit, workspace N, move_workspace N
#
# Key names follow X11 keysym names (case-sensitive):
#   Return, space, q, j, k, 1-9, equal, minus, e, r …

# Launch terminal
bind Mod+Return        = spawn ghostty

# Close focused window
bind Mod+q             = close

# Focus cycle
bind Mod+j             = focus_next
bind Mod+k             = focus_prev

# Toggle floating / tiling
bind Mod+Shift+space   = toggle_floating

# Rotate layout: tile → monocle → float
bind Mod+space         = rotate_layout

# Adjust gaps
bind Mod+equal         = gap_inc
bind Mod+minus         = gap_dec

# Reload config
bind Mod+Shift+r       = spawn swordwm --reload

# Quit WM
bind Mod+Shift+e       = quit

# Workspace switch: Mod+1 … Mod+9
bind Mod+1             = workspace 1
bind Mod+2             = workspace 2
bind Mod+3             = workspace 3
bind Mod+4             = workspace 4
bind Mod+5             = workspace 5
bind Mod+6             = workspace 6
bind Mod+7             = workspace 7
bind Mod+8             = workspace 8
bind Mod+9             = workspace 9

# Move window to workspace: Mod+Shift+1 … Mod+Shift+9
bind Mod+Shift+1       = move_workspace 1
bind Mod+Shift+2       = move_workspace 2
bind Mod+Shift+3       = move_workspace 3
bind Mod+Shift+4       = move_workspace 4
bind Mod+Shift+5       = move_workspace 5
bind Mod+Shift+6       = move_workspace 6
bind Mod+Shift+7       = move_workspace 7
bind Mod+Shift+8       = move_workspace 8
bind Mod+Shift+9       = move_workspace 9

# ── Autostart (runs once at WM start) ─────────────────────
# Uncomment and customise:
#autostart = ~/SwordWM/cyberdesk.sh start
#autostart = sworddeck
#autostart = swordwm-wallpaper --mode gradient
