# =========================================================
# ~/.config/swordwm/config — SwordWM runtime configuration
# Canonical source: swordwm/config/swordwm.conf
#
# Reload without restart: Mod+Shift+r  (or kill -HUP <pid>)
# All changes apply instantly on reload.
# =========================================================

# ── Terminal emulator ─────────────────────────────────────
terminal         = ghostty

# ── Font (Xft font specification) ────────────────────────
font             = JetBrains Mono:size=9:weight=medium

# ── Modifier key: super (Win key) or alt ─────────────────
mod              = super

# ── Gaps (pixels) ─────────────────────────────────────────
gap_inner        = 8
gap_outer        = 8

# Master area width (percent of screen width, 10-90)
master_ratio     = 50
# ── Window decoration ─────────────────────────────────────
border_width     = 2
title_bar_height = 24

# ── Focus model ───────────────────────────────────────────
# true = focus follows mouse pointer, false = click-to-focus
focus_follows_mouse = false

# ── Colours ───────────────────────────────────────────────
# Tokyo Night palette — change freely, reload with Mod+Shift+r
color_focused_border     = #5e81f4
color_unfocused_border   = #2a2d3e
color_focused_title_bg   = #1e2030
color_focused_title_fg   = #c0caf5
color_unfocused_title_bg = #16161e
color_unfocused_title_fg = #565f89
color_urgent_border      = #f7768e

# ── Physics ───────────────────────────────────────────────
# Window physics simulation (gravity, collisions, bouncing)
# Enable for jelly-like window animations, disable for instant moves
physics_enabled     = true

# Gravity strength in px/s^2 (981 = earth-like, 0 = zero-g)
# Higher = windows fall faster; try 200 for a floaty feel
physics_gravity     = 100.0

# Per-step velocity retention (0 = instant stop, 1 = frictionless)
# 0.985 = heavy furniture feel, 0.99 = icy, 0.95 = rubber
physics_friction    = 0.95

# Bounciness of walls and window collisions (0 = dead, 1 = super ball)
# 0.3 = dull thud (default), 0.6 = lively bounce
physics_restitution = 0.0

# Mass density: mass = area * density
# Higher = windows are heavier, harder to push around
physics_mass_density = 0.0005

# Throw speed multiplier (0.65 = 65% of mouse velocity on release)
physics_throw_mult  = 0.65

# Maximum throw speed in px/s (1800 = fast but controlled)
physics_max_throw   = 1800.0

# ── Keybindings ───────────────────────────────────────────
# Format: bind Mod[+Shift][+Ctrl]+Key = action [arg]
# Actions: spawn, close, focus_next, focus_prev,
#          toggle_floating, rotate_layout, gap_inc, gap_dec,
#          move_stack_up, move_stack_down, master_grow, master_shrink,
#          quit, workspace N, move_workspace N
#
# Key names follow X11 keysym names (case-sensitive):
#   Return, space, q, j, k, 1-9, equal, minus, e, r …

# Launch terminal
bind Mod+Return        = spawn ghostty

# Close focused window
bind Mod+q             = close

# Focus cycle
bind Mod+j             = focus_next
bind Mod+k             = focus_prev

# Toggle floating / tiling
bind Mod+Shift+space   = toggle_floating
bind Mod+f             = toggle_floating

# Rotate layout: tile → monocle → float
bind Mod+space         = rotate_layout
# Move focused window in the stack
bind Mod+Shift+j       = move_stack_down
bind Mod+Shift+k       = move_stack_up

# Grow / shrink master area (5% steps)
bind Mod+l             = master_grow
bind Mod+h             = master_shrink

# Adjust gaps
bind Mod+equal         = gap_inc
bind Mod+minus         = gap_dec

# Reload config (instant — no restart needed)
bind Mod+Shift+r       = reload_config
bind Mod+Shift+R       = spawn ~/SwordWM/cyberdesk.sh restart

# Quit WM
bind Mod+Shift+e       = quit
# Workspace switch: Mod+1 … Mod+9

# Previous/next workspace: Mod+Left / Mod+Right

bind Mod+Left          = workspace_prev

bind Mod+Right         = workspace_next

bind Mod+1             = workspace 1
bind Mod+2             = workspace 2
bind Mod+3             = workspace 3
bind Mod+4             = workspace 4
bind Mod+5             = workspace 5
bind Mod+6             = workspace 6
bind Mod+7             = workspace 7
bind Mod+8             = workspace 8
bind Mod+9             = workspace 9

# Move window to workspace: Mod+Shift+1 … Mod+Shift+9
bind Mod+Shift+1       = move_workspace 1
bind Mod+Shift+2       = move_workspace 2
bind Mod+Shift+3       = move_workspace 3
bind Mod+Shift+4       = move_workspace 4
bind Mod+Shift+5       = move_workspace 5
bind Mod+Shift+6       = move_workspace 6
bind Mod+Shift+7       = move_workspace 7
bind Mod+Shift+8       = move_workspace 8
bind Mod+Shift+9       = move_workspace 9

# Minimize focused window (toggle _NET_WM_STATE_HIDDEN)
bind Mod+m             = minimize

# Volume control (no modifier — XF86 media keys)
bind XF86AudioRaiseVolume  = vol_up
bind XF86AudioLowerVolume  = vol_down
bind XF86AudioMute         = mute

# Brightness control (no modifier — XF86 media keys)
bind XF86Display           = bright_up
bind XF86MonBrightnessDown = bright_down

# ── Autostart (runs once at WM start) ─────────────────────
# Uncomment and customise:
#autostart = ~/SwordWM/cyberdesk.sh start
#autostart = sworddeck
#autostart = swordwm-wallpaper --mode gradient
